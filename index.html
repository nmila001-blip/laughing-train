<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome - Imaginary Clinic</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}
body{
  background:#f4f7fb;
  color:#333;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.portal-card{
  background:white;
  padding:40px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  text-align:center;
  max-width:500px;
  width:100%;
}
h1{
  color:#2563eb;
  margin-bottom:10px;
}
p{
  color:#666;
  margin-bottom:30px;
}
.choices{
  display:flex;
  gap:15px;
  flex-direction:column;
}
.portal-btn{
  display:block;
  padding:15px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
  font-size:16px;
  transition:background 0.2s, color 0.2s;
}
.patient-link{
  background:#2563eb;
  color:white;
}
.patient-link:hover{
  background:#1e40af;
}
.owner-link{
  background:#e5e7eb;
  color:#374151;
}
.owner-link:hover{
  background:#d1d5db;
}
</style>
</head>
<body>

<div class="portal-card">
  <h1>Imaginary Clinic</h1>
  <p>Please select your portal to continue</p>
  
  <div class="choices">
    <a href="user.html" class="portal-btn patient-link">Patient Booking Portal</a>
    <a href="owner.html" class="portal-btn owner-link">Owner Dashboard</a>
  </div>
</div>

</body>
</html>
