<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Imaginary Clinic</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#f4f7fb;
  color:#333;
}

header{
  background:#2563eb;
  color:white;
  padding:25px;
  text-align:center;
}

.owner-btn{
  margin-top:15px;
  background:white;
  color:#2563eb;
  border:none;
  padding:12px 20px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.owner-btn:hover{
  background:#dbeafe;
}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
  margin-bottom:25px;
}

.login-box{
  max-width:400px;
  margin:20px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
  display:none;
}

.login-box h2{
  color:#2563eb;
  margin-bottom:20px;
  text-align:center;
}

.calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.calendar-header button{
  background:#2563eb;
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}

.day-name,
.day{
  text-align:center;
  padding:12px;
  border-radius:10px;
}

.day-name{
  background:#dbeafe;
  font-weight:bold;
}

.day{
  background:#f1f5f9;
  cursor:pointer;
}

.day:hover{
  background:#93c5fd;
  color:white;
}

.selected{
  background:#2563eb !important;
  color:white;
}

.empty{
  background:transparent;
}

form{
  display:flex;
  flex-direction:column;
  gap:15px;
}

input,
button{
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
}

.times{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.time-slot{
  background:#eff6ff;
  padding:12px;
  text-align:center;
  border-radius:10px;
  cursor:pointer;
}

.time-slot:hover{
  background:#2563eb;
  color:white;
}

.time-selected{
  background:#1d4ed8 !important;
  color:white;
}

.submit-btn{
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}

.submit-btn:hover{
  background:#1e40af;
}

.confirmation{
  display:none;
  margin-top:20px;
  background:#dcfce7;
  padding:15px;
  border-radius:10px;
  color:#166534;
}

.owner-dashboard{
  display:none;
}

.appointment{
  background:#eff6ff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  border-left:5px solid #2563eb;
}

.delete-btn{
  margin-top:10px;
  background:#dc2626;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}

.delete-btn:hover{
  background:#991b1b;
}

.error{
  color:red;
  text-align:center;
  display:none;
}

@media(max-width:800px){

  .calendar{
    gap:5px;
  }

}

</style>
</head>

<body>

<header>

  <h1>Imaginary Clinic</h1>

  <p>Book Your Appointment Online</p>

  <button class="owner-btn" id="ownerLoginBtn">
    Owner Login
  </button>

</header>

<!-- OWNER LOGIN -->
<div class="login-box" id="loginBox">

  <h2>Owner Login</h2>

  <form id="loginForm">

    <input
      type="email"
      id="ownerEmail"
      placeholder="Owner Email"
      required
    >

    <input
      type="password"
      id="ownerPassword"
      placeholder="Password"
      required
    >

    <button type="submit" class="submit-btn">
      Login
    </button>

  </form>

  <p class="error" id="loginError">
    Incorrect email or password
  </p>

</div>

<div class="container">

  <!-- BOOKING -->
  <div class="card">

    <div class="calendar-header">

      <button id="prevMonth">◀ Prev</button>

      <h2 id="monthYear"></h2>

      <button id="nextMonth">Next ▶</button>

    </div>

    <div class="calendar" id="calendar">

      <div class="day-name">Sun</div>
      <div class="day-name">Mon</div>
      <div class="day-name">Tue</div>
      <div class="day-name">Wed</div>
      <div class="day-name">Thu</div>
      <div class="day-name">Fri</div>
      <div class="day-name">Sat</div>

    </div>

    <hr style="margin:25px 0;">

    <h2>Book Appointment</h2>

    <form id="bookingForm">

      <input
        type="text"
        id="name"
        placeholder="Patient Name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Patient Email"
        required
      >

      <input
        type="text"
        id="selectedDate"
        placeholder="Selected Date"
        readonly
      >

      <input
        type="text"
        id="selectedTime"
        placeholder="Selected Time"
        readonly
      >

      <h3>Select Time</h3>

      <div class="times" id="timesContainer"></div>

      <button type="submit" class="submit-btn">
        Confirm Appointment
      </button>

    </form>

    <div class="confirmation" id="confirmation">
      Appointment booked successfully!
    </div>

  </div>

  <!-- OWNER DASHBOARD -->
  <div class="card owner-dashboard" id="ownerDashboard">

    <h2>Appointments Dashboard</h2>

    <div id="appointmentsList">
      <p>No appointments yet.</p>
    </div>

  </div>

</div>

<script>

const OWNER_EMAIL =
  "nmila001@doral.colegia.org";

const OWNER_PASSWORD =
  "05222014nm";

document.getElementById("ownerLoginBtn")
.addEventListener("click", ()=>{

  const loginBox =
    document.getElementById("loginBox");

  if(loginBox.style.display === "block"){

    loginBox.style.display = "none";

  } else {

    loginBox.style.display = "block";

  }

});

document.getElementById("loginForm")
.addEventListener("submit", function(e){

  e.preventDefault();

  const email =
    document.getElementById("ownerEmail").value;

  const password =
    document.getElementById("ownerPassword").value;

  if(
    email === OWNER_EMAIL &&
    password === OWNER_PASSWORD
  ){

    document.getElementById("ownerDashboard")
      .style.display = "block";

    document.getElementById("loginBox")
      .style.display = "none";

    alert("Owner login successful!");

  } else {

    document.getElementById("loginError")
      .style.display = "block";

  }

});

const calendar =
  document.getElementById("calendar");

const monthYear =
  document.getElementById("monthYear");

const selectedDateInput =
  document.getElementById("selectedDate");

const selectedTimeInput =
  document.getElementById("selectedTime");

const timesContainer =
  document.getElementById("timesContainer");

const confirmation =
  document.getElementById("confirmation");

const appointmentsList =
  document.getElementById("appointmentsList");

const months = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

let currentDate = new Date();

const timeSlots = [
  "9:00 AM",
  "10:00 AM",
  "11:00 AM",
  "12:00 PM",
  "1:00 PM",
  "2:00 PM",
  "3:00 PM",
  "4:00 PM",
  "5:00 PM"
];

let appointments =
  JSON.parse(localStorage.getItem("appointments")) || [];

function renderCalendar(){

  const oldDays =
    document.querySelectorAll(".day, .empty");

  oldDays.forEach(day => day.remove());

  const year = currentDate.getFullYear();

  const month = currentDate.getMonth();

  monthYear.textContent =
    `${months[month]} ${year}`;

  const firstDay =
    new Date(year, month, 1).getDay();

  const daysInMonth =
    new Date(year, month + 1, 0).getDate();

  for(let i=0;i<firstDay;i++){

    const empty =
      document.createElement("div");

    empty.classList.add("empty");

    calendar.appendChild(empty);

  }

  for(let day=1; day<=daysInMonth; day++){

    const dayElement =
      document.createElement("div");

    dayElement.classList.add("day");

    dayElement.textContent = day;

    dayElement.addEventListener("click", ()=>{

      document.querySelectorAll(".day")
      .forEach(d =>
        d.classList.remove("selected")
      );

      dayElement.classList.add("selected");

      selectedDateInput.value =
        `${months[month]} ${day}, ${year}`;

      loadTimeSlots();

    });

    calendar.appendChild(dayElement);

  }

}

function loadTimeSlots(){

  timesContainer.innerHTML = "";

  timeSlots.forEach(time=>{

    const timeElement =
      document.createElement("div");

    timeElement.classList.add("time-slot");

    timeElement.textContent = time;

    timeElement.addEventListener("click", ()=>{

      document.querySelectorAll(".time-slot")
      .forEach(t =>
        t.classList.remove("time-selected")
      );

      timeElement.classList.add("time-selected");

      selectedTimeInput.value = time;

    });

    timesContainer.appendChild(timeElement);

  });

}

document.getElementById("nextMonth")
.addEventListener("click", ()=>{

  currentDate.setMonth(
    currentDate.getMonth()+1
  );

  renderCalendar();

});

document.getElementById("prevMonth")
.addEventListener("click", ()=>{

  currentDate.setMonth(
    currentDate.getMonth()-1
  );

  renderCalendar();

});

document.getElementById("bookingForm")
.addEventListener("submit", function(e){

  e.preventDefault();

  if(
    !selectedDateInput.value ||
    !selectedTimeInput.value
  ){

    alert("Please select a date and time.");

    return;

  }

  const appointment = {

    name:
      document.getElementById("name").value,

    email:
      document.getElementById("email").value,

    date:
      selectedDateInput.value,

    time:
      selectedTimeInput.value

  };

  appointments.push(appointment);

  localStorage.setItem(
    "appointments",
    JSON.stringify(appointments)
  );

  renderAppointments();

  confirmation.style.display = "block";

  this.reset();

  timesContainer.innerHTML = "";

  setTimeout(()=>{

    confirmation.style.display = "none";

  },3000);

});

function renderAppointments(){

  if(appointments.length === 0){

    appointmentsList.innerHTML =
      "<p>No appointments yet.</p>";

    return;

  }

  appointmentsList.innerHTML = "";

  appointments.forEach((appt, index)=>{

    const div =
      document.createElement("div");

    div.classList.add("appointment");

    div.innerHTML = `

      <h3>${appt.name}</h3>

      <p>
        <strong>Email:</strong>
        ${appt.email}
      </p>

      <p>
        <strong>Date:</strong>
        ${appt.date}
      </p>

      <p>
        <strong>Time:</strong>
        ${appt.time}
      </p>

      <button
        class="delete-btn"
        onclick="deleteAppointment(${index})"
      >
        Delete
      </button>

    `;

    appointmentsList.appendChild(div);

  });

}

function deleteAppointment(index){

  appointments.splice(index,1);

  localStorage.setItem(
    "appointments",
    JSON.stringify(appointments)
  );

  renderAppointments();

}

renderCalendar();
renderAppointments();

</script>

</body>
</html>
