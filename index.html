<!DOCTYPE html>
<html>
<head>
  <title>SafeWatch Bullying Detector</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b0f14;
      color: white;
    }

    /* LOGIN */
    #loginScreen {
      position: fixed;
      inset: 0;
      background: #0b0f14;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .box {
      width: 320px;
      background: #151b22;
      padding: 20px;
      border-radius: 12px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #00c853;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* APP */
    #app {
      display: none;
      padding: 20px;
    }

    .panel {
      max-width: 600px;
      margin: auto;
      background: #151b22;
      padding: 20px;
      border-radius: 12px;
    }

    #result {
      margin-top: 10px;
      padding: 10px;
      background: #1c2430;
      border-radius: 8px;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      padding: 10px 16px;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="box">
    <h2>Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p style="font-size:12px;opacity:0.7;">
      Demo login: anything works
    </p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="panel">
    <h2>Bullying Detector (AI)</h2>

    <textarea id="inputText" rows="5" placeholder="Enter message..."></textarea>

    <button onclick="analyze()">Analyze</button>

    <div id="result">Result will show here</div>

    <button onclick="logout()" style="margin-top:10px;background:red;">
      Logout
    </button>
  </div>
</div>

<div id="toast"></div>

<script>

/* ---------------- TOAST ---------------- */
function showToast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}

/* ---------------- LOGIN SYSTEM ---------------- */
function login() {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  if (!email || !pass) {
    showToast("Enter email + password");
    return;
  }

  localStorage.setItem("loggedIn", "true");
  localStorage.setItem("userEmail", email);

  unlock();
  showToast("Logged in");
}

function logout() {
  localStorage.clear();
  location.reload();
}

function checkLogin() {
  if (localStorage.getItem("loggedIn") === "true") {
    unlock();
  }
}

function unlock() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
}

/* ---------------- TEACHABLE MACHINE ---------------- */

let model;
let predicting = false;

// IMPORTANT: replace with your actual model links
async function loadModel() {
  try {
    model = await tmImage.load(
      "model.json",
      "metadata.json"
    );
    console.log("Model loaded");
  } catch (e) {
    console.error(e);
    showToast("Model failed to load");
  }
}

async function analyze() {
  if (!model) {
    showToast("Model not loaded");
    return;
  }

  if (predicting) return;

  const text = document.getElementById("inputText").value;

  if (!text.trim()) {
    showToast("Enter text");
    return;
  }

  predicting = true;

  try {
    const prediction = await model.predict(text);

    // 🔥 FIX #1: prevent .map crash
    if (!prediction || !Array.isArray(prediction)) {
      showToast("Bad model response");
      return;
    }

    let best = prediction.reduce((a, b) =>
      a.probability > b.probability ? a : b
    );

    const result = document.getElementById("result");

    if (best.className.toLowerCase().includes("bully")) {
      result.innerHTML = "🚨 Bullying Detected";
      result.style.color = "red";
    } else {
      result.innerHTML = "✅ No Bullying Detected";
      result.style.color = "lime";
    }

  } catch (err) {
    console.error(err);
    showToast("Analysis failed");
  } finally {
    // 🔥 FIX #2: prevents freeze bug
    predicting = false;
  }
}

/* INIT */
checkLogin();
loadModel();

</script>

<!-- Teachable Machine library -->
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

</body>
</html>
