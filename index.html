<!DOCTYPE html>
<html>
<head>
  <title>SafeWatch AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b0f14;
      color: white;
      text-align: center;
    }

    /* LOGIN */
    #loginScreen {
      position: fixed;
      inset: 0;
      background: #0b0f14;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .box {
      width: 320px;
      background: #151b22;
      padding: 20px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #00c853;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    /* APP */
    #app {
      display: none;
      padding: 20px;
    }

    video {
      width: 320px;
      border-radius: 10px;
      margin-top: 10px;
    }

    #result {
      margin-top: 10px;
      padding: 10px;
      background: #151b22;
      border-radius: 8px;
      display: inline-block;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="box">
    <h2>SafeWatch Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p style="font-size:12px;opacity:0.7;">
      Demo login: anything works
    </p>
  </div>
</div>

<!-- APP -->
<div id="app">

  <h2>SafeWatch Bullying Detector</h2>

  <video id="webcam" autoplay playsinline></video>

  <button onclick="startCamera()">Start Camera</button>
  <button onclick="logout()" style="background:red;">Logout</button>

  <div id="result">Waiting...</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>

/* ---------------- LOGIN ---------------- */
function login() {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  if (!email || !pass) return;

  localStorage.setItem("loggedIn", "true");
  unlock();
}

function logout() {
  localStorage.clear();
  location.reload();
}

function checkLogin() {
  if (localStorage.getItem("loggedIn") === "true") {
    unlock();
  }
}

function unlock() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
}

/* ---------------- MODEL ---------------- */

let model;
let webcam;
let busy = false;

// 🔥 YOUR MODEL LINK
const URL = "https://nmila001-blip.github.io/laughing-train/";

async function loadModel() {
  try {
    model = await tmImage.load(
      URL + "model.json",
      URL + "metadata.json"
    );
    console.log("Model loaded");
  } catch (e) {
    console.error(e);
    alert("Model failed to load");
  }
}

async function startCamera() {
  if (!model) await loadModel();

  webcam = new tmImage.Webcam(320, 240, true);
  await webcam.setup();
  await webcam.play();

  document.getElementById("webcam").srcObject = webcam.webcam;

  loop();
}

async function loop() {
  webcam.update();
  await predict();
  requestAnimationFrame(loop);
}

async function predict() {
  if (busy || !model) return;
  busy = true;

  try {
    const prediction = await model.predict(webcam.canvas);

    if (!Array.isArray(prediction)) return;

    let best = prediction.reduce((a, b) =>
      a.probability > b.probability ? a : b
    );

    const result = document.getElementById("result");

    if (best.className.toLowerCase().includes("bully")) {
      result.innerHTML = "🚨 Bullying Detected";
      result.style.color = "red";
    } else {
      result.innerHTML = "✅ Safe";
      result.style.color = "lime";
    }

  } catch (err) {
    console.log(err);
  } finally {
    busy = false;
  }
}

/* INIT */
checkLogin();

</script>

</body>
</html>
