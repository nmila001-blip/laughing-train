<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial;
  background:#f4f7fb;
  margin:0;
}

header{
  background:#2563eb;
  color:white;
  padding:20px;
  text-align:center;
  position:relative;
}

.home{
  position:absolute;
  left:10px;
  top:10px;
  background:white;
  color:#2563eb;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:800px;
  margin:20px auto;
}

.card{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.delete{
  background:red;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
<a href="index.html"><button class="home">🏠 Home</button></a>
<h2>Appointments</h2>
</header>

<div class="container" id="list"></div>

<script>
const SUPABASE_URL = "https://fsbpbnurfbubflszjmas.supabase.co";
const SUPABASE_KEY = "sb_publishable_WAbUS1LIKOevak1NYGiaLA_OV5FiC1L";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let data = [];

async function load(){
  try {
    const { data: res, error } = await client
      .from("appointments")
      .select("*")
      .order("date", { ascending: true })
      .order("time", { ascending: true });

    if (error) {
      console.error("Supabase error:", error.message);
      return;
    }

    data = res || [];
    render();

  } catch (err) {
    console.error("Network error:", err.message);
  }
}

function render(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  if(!data || data.length === 0){
    list.innerHTML = "<p>No appointments yet.</p>";
    return;
  }

  data.forEach(a => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${a.name || "No name"}</b><br>
      ${a.email || ""}<br>
      ${a.date || ""} ${a.time || ""}<br><br>
      <button class="delete">Delete</button>
    `;

    div.querySelector(".delete").onclick = async () => {
      await client.from("appointments").delete().eq("id", a.id);
      load();
    };

    list.appendChild(div);
  });
}

// realtime updates
client
  .channel("live")
  .on("postgres_changes", {
    event: "*",
    schema: "public",
    table: "appointments"
  }, load)
  .subscribe();

// initial load
load();
</script>

</body>
</html>
