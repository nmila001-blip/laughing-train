<!DOCTYPE html>
<html>
<head>
<title>Owner Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f4f7fb;}
header{background:#2563eb;color:white;padding:20px;position:relative;}
.container{max-width:800px;margin:20px auto;}
.card{background:white;padding:15px;margin-bottom:10px;border-radius:10px;}
input{width:100%;padding:10px;margin:5px 0;}
button{background:red;color:white;border:none;padding:5px;border-radius:6px;}
.home{
position:absolute;left:10px;top:10px;
background:white;color:#2563eb;
padding:8px 12px;border:none;border-radius:8px;
}
</style>
</head>

<body>

<header>
<a href="index.html"><button class="home">🏠 Home</button></a>
<h2 style="text-align:center;">Owner Dashboard</h2>
</header>

<div class="container">

<input type="date" id="filter" onchange="render()">
<input id="search" placeholder="Search">

<div id="list"></div>

</div>

<script>
const client = supabase.createClient(
"https://fsbpbnurfbubflszjmas.supabase.co",
"sb_publishable_WAbUS1LIKOevak1NYGiaLA_OV5FiC1L"
);

let data = [];

async function load(){
const { data: res } = await client.from("appointments").select("*");
data = res || [];
render();
}

function render(){

let filtered = data;

const q = search.value.toLowerCase();
const d = filter.value;

if(q){
filtered = filtered.filter(a =>
a.name.toLowerCase().includes(q) ||
a.email.toLowerCase().includes(q)
);
}

if(d){
filtered = filtered.filter(a => a.date === d);
}

list.innerHTML = "";

filtered.forEach(a => {
const div = document.createElement("div");
div.className="card";

div.innerHTML=`
<b>${a.name}</b><br>
${a.email}<br>
${a.date} ${a.time}<br><br>
<button>Delete</button>
`;

div.querySelector("button").onclick = async () => {
await client.from("appointments").delete().eq("id", a.id);
load();
};

list.appendChild(div);
});
}

client.channel("live")
.on("postgres_changes",{event:"*"},load)
.subscribe();

load();
</script>

</body>
</html>
