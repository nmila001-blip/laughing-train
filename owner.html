<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Owner Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
}

header{
  background:#2563eb;
  color:white;
  padding:25px;
  text-align:center;
}

.container{
  max-width:1000px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

input{
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
}

.btn{
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#2563eb;
  color:white;
}

.danger{
  background:#dc2626;
  color:white;
}

.appointment{
  background:#eff6ff;
  border-left:5px solid #2563eb;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.empty{
  text-align:center;
  color:#666;
  padding:30px;
}
</style>
</head>

<body>

<header>
  <h1>Imaginary Clinic</h1>
  <p>Owner Dashboard</p>
</header>

<div class="container">

<div class="card">

<div class="controls">
  <input type="text" id="searchBar" placeholder="Search patient..." />
  <a href="index.html">
    <button class="btn primary">Back Home</button>
  </a>
</div>

<div id="appointmentsList"></div>

</div>
</div>

<script>
const SUPABASE_URL = "https://fsbpbnurfbubflszjmas.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_WAbUS1LIKOevak1NYGiaLA_OV5FiC1L";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const appointmentsList = document.getElementById("appointmentsList");
const searchBar = document.getElementById("searchBar");

let appointments = [];

async function fetchAppointments(){

  const { data, error } = await client
    .from("appointments")
    .select("*")
    .order("date", { ascending:true })
    .order("time", { ascending:true });

  if(error){
    console.error(error.message);
    return;
  }

  appointments = data || [];
  renderAppointments();
}

function renderAppointments(){

  const query = searchBar.value.toLowerCase();

  const filtered = appointments.filter(appt =>
    (appt.name || "").toLowerCase().includes(query) ||
    (appt.email || "").toLowerCase().includes(query)
  );

  if(filtered.length === 0){
    appointmentsList.innerHTML =
      '<p class="empty">No appointments found.</p>';
    return;
  }

  appointmentsList.innerHTML = "";

  filtered.forEach(appt => {

    const div = document.createElement("div");

    div.className = "appointment";

    div.innerHTML = `
      <div>
        <h3>${appt.name}</h3>
        <p>${appt.email}</p>
        <p>${appt.date} at ${appt.time}</p>
      </div>

      <button class="btn danger">
        Delete
      </button>
    `;

    const deleteBtn = div.querySelector("button");

    deleteBtn.addEventListener("click", async () => {

      if(!confirm("Delete appointment?")) return;

      const { error } = await client
        .from("appointments")
        .delete()
        .eq("id", appt.id);

      if(error){
        alert(error.message);
      }else{
        fetchAppointments();
      }
    });

    appointmentsList.appendChild(div);
  });
}

searchBar.addEventListener("input", renderAppointments);

fetchAppointments();

client
.channel("appointments-channel")
.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"appointments"
  },
  () => {
    fetchAppointments();
  }
)
.subscribe();
</script>

</body>
</html>
