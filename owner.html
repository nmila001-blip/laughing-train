<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f4f7fb;margin:0;}
header{background:#2563eb;color:white;padding:20px;text-align:center;}
.container{max-width:800px;margin:20px auto;}
.card{background:white;padding:20px;border-radius:15px;}
.appointment{padding:10px;border-bottom:1px solid #eee;}
button{background:red;color:white;border:none;padding:5px;border-radius:5px;}
</style>
</head>

<body>

<header>
  <h2>Owner Dashboard</h2>
</header>

<div class="container">
<div class="card">

<input id="search" placeholder="Search">

<div id="list"></div>

</div>
</div>

<script>
const SUPABASE_URL = "https://fsbpbnurfbubflszjmas.supabase.co";
const SUPABASE_KEY = "sb_publishable_WAbUS1LIKOevak1NYGiaLA_OV5FiC1L";

if (!window.supabase) alert("Supabase failed to load");

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const list = document.getElementById("list");
const search = document.getElementById("search");

let dataCache = [];

async function load() {
  const { data, error } = await client
    .from("appointments")
    .select("*")
    .order("date");

  if (error) return console.log(error.message);

  dataCache = data;
  render();
}

function render() {
  const q = search.value.toLowerCase();

  const filtered = dataCache.filter(a =>
    a.name.toLowerCase().includes(q) ||
    a.email.toLowerCase().includes(q)
  );

  list.innerHTML = "";

  filtered.forEach(a => {
    const div = document.createElement("div");
    div.className = "appointment";

    div.innerHTML = `
      <b>${a.name}</b><br>
      ${a.email}<br>
      ${a.date} ${a.time}
      <button>Delete</button>
    `;

    div.querySelector("button").onclick = async () => {
      await client.from("appointments").delete().eq("id", a.id);
      load();
    };

    list.appendChild(div);
  });
}

search.addEventListener("input", render);

load();

// realtime
client.channel("db")
.on("postgres_changes", {
  event: "*",
  schema: "public",
  table: "appointments"
}, load)
.subscribe();
</script>

</body>
</html>
