<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f4f7fb;margin:0;}
header{background:#2563eb;color:white;text-align:center;padding:20px;}
.container{max-width:800px;margin:20px auto;}
.card{background:white;padding:15px;border-radius:12px;margin-bottom:10px;}
.app{padding:10px;border-bottom:1px solid #eee;}
button{background:red;color:white;border:none;padding:5px;border-radius:5px;}
input{padding:10px;width:100%;margin-bottom:10px;}
</style>
</head>

<body>

<header>
  <h2>Owner Dashboard</h2>
</header>

<div class="container">

<!-- 📅 CALENDAR FILTER -->
<div class="card">
  <h3>Filter by Date</h3>
  <input type="date" id="filterDate" onchange="render()">
</div>

<div class="card">
  <input id="search" placeholder="Search name/email">
</div>

<div id="list"></div>

</div>

<script>
const SUPABASE_URL = "https://fsbpbnurfbubflszjmas.supabase.co";
const SUPABASE_KEY = "sb_publishable_WAbUS1LIKOevak1NYGiaLA_OV5FiC1L";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let data = [];

async function load(){
  const { data: res } = await client
    .from("appointments")
    .select("*")
    .order("date");

  data = res || [];
  render();
}

function render(){

  const q = search.value.toLowerCase();
  const d = filterDate.value;

  let filtered = data;

  if(q){
    filtered = filtered.filter(a =>
      a.name.toLowerCase().includes(q) ||
      a.email.toLowerCase().includes(q)
    );
  }

  if(d){
    filtered = filtered.filter(a => a.date === d);
  }

  list.innerHTML = "";

  filtered.forEach(a => {

    const div = document.createElement("div");
    div.className = "card app";

    div.innerHTML = `
      <b>${a.name}</b><br>
      ${a.email}<br>
      ${a.date} ${a.time}<br><br>
      <button>Delete</button>
    `;

    div.querySelector("button").onclick = async () => {
      await client.from("appointments").delete().eq("id", a.id);
      load();
    };

    list.appendChild(div);
  });
}

search.addEventListener("input", render);

// realtime updates
client.channel("live")
.on("postgres_changes", {
  event:"*",
  schema:"public",
  table:"appointments"
}, load)
.subscribe();

load();
</script>

</body>
</html>
