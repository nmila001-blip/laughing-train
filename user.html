<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Booking</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f4f7fb;margin:0;}
header{background:#2563eb;color:white;text-align:center;padding:20px;}
.container{max-width:500px;margin:30px auto;background:white;padding:20px;border-radius:12px;}
input,button{width:100%;padding:10px;margin:8px 0;}
button{background:#2563eb;color:white;border:none;border-radius:8px;}
.card{padding:10px;margin-bottom:10px;}
</style>
</head>

<body>

<header>
  <h2>Book Appointment</h2>
</header>

<div class="container">

<div class="card">
  <input id="name" placeholder="Name">
  <input id="email" placeholder="Email">

  <!-- 📅 CALENDAR -->
  <input type="date" id="date">

  <input type="time" id="time">

  <button onclick="book()">Submit</button>
</div>

<p id="msg"></p>

</div>

<script>
const SUPABASE_URL = "https://fsbpbnurfbubflszjmas.supabase.co";
const SUPABASE_KEY = "sb_publishable_WAbUS1LIKOevak1NYGiaLA_OV5FiC1L";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// prevent past dates
document.getElementById("date").min =
  new Date().toISOString().split("T")[0];

async function book(){

  const data = {
    name: name.value,
    email: email.value,
    date: date.value,
    time: time.value
  };

  const { error } = await client
    .from("appointments")
    .insert([data]);

  if(error){
    msg.innerText = error.message;
  } else {
    msg.innerText = "Booked successfully!";
  }
}
</script>

</body>
</html>
