<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Appointment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial;
  background:#f4f7fb;
  margin:0;
}

header{
  background:#2563eb;
  color:white;
  text-align:center;
  padding:20px;
}

.container{
  max-width:650px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
}

button{ cursor:pointer; }

.home{
  display:block;
  background:#e5e7eb;
  padding:10px;
  border-radius:8px;
  text-align:center;
  text-decoration:none;
  color:black;
  margin-bottom:10px;
}

/* CALENDAR */
.cal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 0;
  font-weight:bold;
}

.cal-header button{
  background:#2563eb;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
}

#calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.day{
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:center;
  cursor:pointer;
  background:white;
}

.day:hover{ background:#e5e7eb; }

.day.selected{
  background:#2563eb;
  color:white;
}

.day.disabled{
  background:#ccc;
  pointer-events:none;
}

.day.empty{
  border:none;
  background:transparent;
}

/* SLOTS */
.slot-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:10px;
}

.slot{
  padding:10px;
  border:1px solid #2563eb;
  border-radius:8px;
  text-align:center;
  cursor:pointer;
}

.slot.selected{
  background:#2563eb;
  color:white;
}

.slot.disabled{
  background:#ccc;
  pointer-events:none;
}

.submit{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:8px;
}

#msg{
  margin-top:10px;
  font-weight:bold;
}

</style>
</head>

<body>

<header>
  <h2>Book Appointment</h2>
</header>

<div class="container">

<a href="index.html" class="home">🏠 Home</a>

<input id="name" placeholder="Name">
<input id="email" type="email" placeholder="Email">

<h3>Select Date</h3>

<div class="cal-header">
  <button onclick="prevMonth()">◀</button>
  <div id="monthLabel"></div>
  <button onclick="nextMonth()">▶</button>
</div>

<div id="calendar"></div>

<h3>Select Time Slot</h3>
<div class="slot-grid" id="slots"></div>

<button class="submit" onclick="book()">Book Appointment</button>

<p id="msg"></p>

</div>

<script>

const client = supabase.createClient(
  "https://fsbpbnurfbubflszjmas.supabase.co",
  "sb_publishable_WAbUS1LIKOevak1NYGiaLA_OV5FiC1L"
);

let selectedDate = "";
let selectedTime = "";
let currentDate = new Date();

/* ---------------- TIMES ---------------- */

const times = [
"09:00","09:30","10:00","10:30","11:00","11:30",
"12:00","12:30","13:00","13:30","14:00","14:30",
"15:00","15:30","16:00","16:30","17:00","17:30"
];

/* ---------------- LOAD APPOINTMENTS ---------------- */

async function getAppointments(){

  const { data } = await client
    .from("appointments")
    .select("date,time");

  return data || [];
}

/* ---------------- CALENDAR ---------------- */

async function renderCalendar(){

  const calendar = document.getElementById("calendar");
  const label = document.getElementById("monthLabel");

  calendar.innerHTML = "";

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  label.innerText =
    currentDate.toLocaleString("default",{month:"long",year:"numeric"});

  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();

  const all = await getAppointments();

  for(let i=0;i<firstDay;i++){
    const empty = document.createElement("div");
    empty.className="day empty";
    calendar.appendChild(empty);
  }

  for(let day=1;day<=daysInMonth;day++){

    const dateStr =
      `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    const div=document.createElement("div");
    div.className="day";
    div.innerText=day;

    div.onclick=()=>{
      selectedDate=dateStr;
      selectedTime="";

      document.querySelectorAll(".day")
        .forEach(d=>d.classList.remove("selected"));

      div.classList.add("selected");

      renderSlots(all);
    };

    calendar.appendChild(div);
  }
}

/* ---------------- SLOTS ---------------- */

function renderSlots(all){

  const container=document.getElementById("slots");
  container.innerHTML="";

  if(!selectedDate) return;

  const booked = all
    .filter(x=>x.date===selectedDate)
    .map(x=>x.time.slice(0,5)); // FIX

  times.forEach(t=>{

    const div=document.createElement("div");
    div.className="slot";
    div.innerText=t;

    if(booked.includes(t)){
      div.classList.add("disabled");
    } else {
      div.onclick=()=>{
        selectedTime=t;

        document.querySelectorAll(".slot")
          .forEach(s=>s.classList.remove("selected"));

        div.classList.add("selected");
      };
    }

    container.appendChild(div);
  });
}

/* ---------------- BOOK ---------------- */

async function book(){

  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();

  if(!name||!email||!selectedDate||!selectedTime){
    document.getElementById("msg").innerText="Fill everything";
    return;
  }

  const { error } = await client
    .from("appointments")
    .insert([{
      name,
      email,
      date:selectedDate,
      time:selectedTime
    }]);

  if(error){
    document.getElementById("msg").innerText=error.message;
    return;
  }

  document.getElementById("msg").innerText="Booked!";

  selectedTime="";

  renderCalendar();
}

/* ---------------- NAV ---------------- */

function nextMonth(){
  currentDate.setMonth(currentDate.getMonth()+1);
  renderCalendar();
}

function prevMonth(){
  currentDate.setMonth(currentDate.getMonth()-1);
  renderCalendar();
}

/* ---------------- INIT ---------------- */

renderCalendar();

</script>

</body>
</html>
