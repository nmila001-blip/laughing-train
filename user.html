<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Appointment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial;
  background:#f4f7fb;
  margin:0;
}

header{
  background:#2563eb;
  color:white;
  text-align:center;
  padding:20px;
}

.container{
  max-width:600px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
}

button{
  cursor:pointer;
}

.slot-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:10px;
}

.slot{
  padding:10px;
  border:1px solid #2563eb;
  border-radius:8px;
  background:white;
  text-align:center;
  cursor:pointer;
}

.slot.selected{
  background:#2563eb;
  color:white;
}

.slot.disabled{
  background:#ccc;
  color:#666;
  border:none;
  cursor:not-allowed;
}

.submit{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:8px;
}

.home{
  display:block;
  background:#e5e7eb;
  padding:10px;
  border-radius:8px;
  width:100%;
  margin-bottom:10px;
  text-decoration:none;
  color:black;
  text-align:center;
}

#msg{
  margin-top:15px;
  font-weight:bold;
}

</style>
</head>

<body>

<header>
<h2>Book Appointment</h2>
</header>

<div class="container">

<a href="index.html" class="home">
🏠 Home
</a>

<input id="name" placeholder="Name">

<input
  id="email"
  type="email"
  placeholder="Email"
>

<input type="date" id="date">

<h3>Select Time Slot</h3>

<div class="slot-grid" id="slots"></div>

<button class="submit" onclick="book()">
Book Appointment
</button>

<p id="msg"></p>

</div>

<script>

const client = supabase.createClient(
  "https://fsbpbnurfbubflszjmas.supabase.co",
  "sb_publishable_CtgmqdL-YSPFimgvFZtUSg_7s8U0-MH"
);

const msg =
  document.getElementById("msg");

let selectedTime = "";

/* ---------------- DATE LIMIT ---------------- */

document.getElementById("date").min =
  new Date().toISOString().split("T")[0];

/* ---------------- TIME SLOTS ---------------- */

const times = [
"09:00","09:30",
"10:00","10:30",
"11:00","11:30",
"12:00","12:30",
"13:00","13:30",
"14:00","14:30",
"15:00","15:30",
"16:00","16:30",
"17:00","17:30"
];

/* ---------------- RENDER SLOTS ---------------- */

async function renderSlots(){

  const container =
    document.getElementById("slots");

  container.innerHTML = "";

  const date =
    document.getElementById("date").value;

  let booked = [];

  if(date){

    const { data } =
      await client
        .from("appointments")
        .select("time")
        .eq("date", date);

    booked =
      data ? data.map(x => x.time) : [];
  }

  times.forEach(t => {

    const btn =
      document.createElement("div");

    btn.className = "slot";

    btn.innerText = t;

    if(booked.includes(t)){

      btn.classList.add("disabled");

    } else {

      btn.onclick = () => {

        selectedTime = t;

        document
          .querySelectorAll(".slot")
          .forEach(s =>
            s.classList.remove("selected")
          );

        btn.classList.add("selected");
      };
    }

    container.appendChild(btn);
  });
}

/* ---------------- DATE CHANGE ---------------- */

document
  .getElementById("date")
  .addEventListener("change", renderSlots);

/* ---------------- BOOK ---------------- */

async function book(){

  const name =
    document.getElementById("name")
    .value
    .trim();

  const email =
    document.getElementById("email")
    .value
    .trim();

  const date =
    document.getElementById("date")
    .value;

  if(!name || !email || !date || !selectedTime){

    msg.innerText =
      "Fill all fields + select time";

    return;
  }

  const { error } =
    await client
      .from("appointments")
      .insert([{
        name,
        email,
        date,
        time:selectedTime
      }]);

  if(error){

    msg.innerText = error.message;

    return;
  }

  msg.innerText =
    "Appointment booked!";

  document.getElementById("name").value = "";

  document.getElementById("email").value = "";

  selectedTime = "";

  renderSlots();
}

/* ---------------- INIT ---------------- */

renderSlots();

</script>

</body>
</html>
