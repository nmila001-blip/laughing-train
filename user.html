<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Session - JAMES PHOTOGRAPHY</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: #0b0b0b;
            color: #ffffff;
            margin: 0;
        }
        header {
            background: #161616;
            color: white;
            text-align: center;
            padding: 25px;
            border-bottom: 1px solid #2c2c2c;
            letter-spacing: 2px;
        }
        h2 { margin: 0; font-size: 22px; }
        .container {
            max-width: 650px;
            margin: 30px auto;
            background: #161616;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #2c2c2c;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #222222;
            border: 1px solid #444444;
            color: white;
            border-radius: 6px;
        }
        input:focus {
            outline: none;
            border-color: #ffffff;
        }
        .home {
            display: inline-block;
            background: #222222;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            color: #aaaaaa;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #333333;
        }
        .home:hover { color: #ffffff; background: #333333; }
        h3 {
            margin-top: 25px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaaaaa;
        }
        /* calendar */
        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            font-weight: bold;
        }
        .cal-header button {
            background: #ffffff;
            color: black;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .cal-header button:hover { background: #cccccc; }
        #calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .day {
            padding: 12px;
            border: 1px solid #2c2c2c;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            background: #222222;
            color: #ffffff;
        }
        .day:hover:not(.disabled):not(.empty) { border-color: #ffffff; }
        .day.selected { background: #ffffff; color: black; font-weight: bold; }
        .day.disabled { background: #111111; color: #444444; cursor: not-allowed; border: none; }
        .day.empty { border: none; background: transparent; }
        
        /* slots */
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .slot {
            padding: 12px;
            border: 1px solid #444444;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            background: #222222;
        }
        .slot:hover:not(.disabled) { border-color: #ffffff; }
        .slot.selected { background: #ffffff; color: black; font-weight: bold; border-color: #ffffff; }
        .slot.disabled { background: #111111; color: #444444; border-color: #222222; cursor: not-allowed; }
        
        .submit {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            background: #ffffff;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .submit:hover { background: #cccccc; }
        #msg { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <header><h2>JAMES PHOTOGRAPHY</h2></header>
    
    <div class="container">
        <a href="index.html" class="home">← Back to Home</a>
        
        <input id="name" placeholder="Full Name">
        <input id="email" type="email" placeholder="Email Address">
        <input id="car" placeholder="Vehicle Details (Year, Make, Model)">
        
        <h3>Select Date</h3>
        <div class="cal-header">
            <button onclick="prevMonth()">◀</button>
            <div id="monthLabel"></div>
            <button onclick="nextMonth()">▶</button>
        </div>
        <div id="calendar"></div>
        
        <h3>Select Available Time Slot</h3>
        <div class="slot-grid" id="slots"></div>
        
        <button class="submit" onclick="book()">Request 2-Hour Session ($100)</button>
        <p id="msg"></p>
    </div>

    <script>
        const client = supabase.createClient(
            "https://supabase.co",
            "sb_publishable_WAbUS1LIKOevak1NYGiaLA_OV5FiC1L"
        );
        
        let selectedDate = "";
        let selectedTime = "";
        let currentDate = new Date();
        
        const times = [
            "12:00", "12:30", "13:00", "13:30", "14:00", "14:30",
            "15:00", "15:30", "16:00", "16:30", "17:00", "17:30"
        ];
        
        function to12Hour(t){
            let [h, m] = t.split(":");
            h = parseInt(h);
            const ampm = h >= 12 ? "PM" : "AM";
            h = h % 12 || 12;
            return `${h}:${m} ${ampm}`;
        }
        
        async function getAppointments(){
            const { data } = await client.from("appointments").select("date,time");
            return data || [];
        }
        
        async function renderCalendar(){
            const calendar = document.getElementById("calendar");
            const label = document.getElementById("monthLabel");
            calendar.innerHTML = "";
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            label.innerText = currentDate.toLocaleString("default", { month: "long", year: "numeric" });
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const all = await getAppointments();
            
            for(let i = 0; i < firstDay; i++){
                const e = document.createElement("div");
                e.className = "day empty";
                calendar.appendChild(e);
            }
            
            for(let d = 1; d <= daysInMonth; d++){
                const targetDate = new Date(year, month, d);
                const dayOfWeek = targetDate.getDay(); 
                const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
                
                const div = document.createElement("div");
                div.className = "day";
                div.innerText = d;
                
                const today = new Date();
                today.setHours(0,0,0,0);
                
                if (targetDate < today || dayOfWeek === 0 || dayOfWeek === 4) {
                    div.classList.add("disabled");
                } else {
                    div.onclick = () => {
                        selectedDate = dateStr;
                        selectedTime = "";
                        document.querySelectorAll(".day").forEach(x => x.classList.remove("selected"));
                        div.classList.add("selected");
                        renderSlots(all);
                    };
                }
                calendar.appendChild(div);
            }
        }
        
        function renderSlots(all){
            const container = document.getElementById("slots");
            container.innerHTML = "";
            if(!selectedDate) return;
            
            const booked = all
                .filter(x => x.date === selectedDate)
                .map(x => x.time.slice(0,5));
                
            times.forEach(t => {
                const div = document.createElement("div");
                div.className = "slot";
                div.innerText = to12Hour(t);
                
                if(booked.includes(t)){
                    div.classList.add("disabled");
                } else {
                    div.onclick = () => {
                        selectedTime = t;
                        document.querySelectorAll(".slot").forEach(s => s.classList.remove("selected"));
                        div.classList.add("selected");
                    };
                }
                container.appendChild(div);
            });
        }
        
        async function book(){
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const car = document.getElementById("car").value.trim();
            
            if(!name || !email || !car || !selectedDate || !selectedTime){
                document.getElementById("msg").style.color = "#ff4444";
                document.getElementById("msg").innerText = "Please complete all fields.";
                return;
            }
            
            const { error } = await client.from("appointments").insert([{
                name,
                email,
                car_details: car, 
                date: selectedDate,
                time: selectedTime
            }]);
            
            if(error){
                document.getElementById("msg").style.color = "#ff4444";
document.getElementById("msg").innerText = error.message;return;
            }document.getElementById("msg").style.color = "#44ff44";
          document.getElementById("msg").innerText = "Booking request submitted successfully!";
          selectedTime = "";document.getElementById("name").value = "";
          document.getElementById("email").value = "";
          document.getElementById("car").value = "";
          renderCalendar();
        }function nextMonth(){
          currentDate.setMonth(currentDate.getMonth()+1); 
          renderCalendar();
        }function prevMonth(){ 
          currentDate.setMonth(currentDate.getMonth()-1);
          renderCalendar(); 
        }renderCalendar();
