<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Session - JAMES PHOTOGRAPHY</title>
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: #0b0b0b; color: #ffffff; margin: 0; }
        header { background: #161616; color: white; text-align: center; padding: 25px; border-bottom: 1px solid #2c2c2c; letter-spacing: 2px; }
        h2 { margin: 0; font-size: 22px; }
        .container { max-width: 650px; margin: 30px auto; background: #161616; padding: 25px; border-radius: 12px; border: 1px solid #2c2c2c; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #222222; border: 1px solid #444444; color: white; border-radius: 6px; }
        input:focus { outline: none; border-color: #ffffff; }
        .home { display: inline-block; background: #222222; padding: 8px 16px; border-radius: 6px; text-decoration: none; color: #aaaaaa; margin-bottom: 20px; font-size: 14px; border: 1px solid #333333; }
        .home:hover { color: #ffffff; background: #333333; }
        h3 { margin-top: 25px; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: #aaaaaa; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; font-weight: bold; }
        .cal-header button { background: #ffffff; color: black; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .cal-header button:hover { background: #cccccc; }
        #monthLabel { font-size: 16px; color: #ffffff; font-weight: bold; }
        #calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; min-height: 100px; }
        .day { padding: 12px; border: 1px solid #333333; border-radius: 8px; text-align: center; cursor: pointer; background: #222222; color: #ffffff !important; font-weight: bold; }
        .day:hover:not(.disabled):not(.empty) { border-color: #ffffff; background: #333333; }
        .day.selected { background: #ffffff !important; color: #000000 !important; font-weight: bold; }
        .day.disabled { background: #111111; color: #555555 !important; cursor: not-allowed; border: 1px solid #1a1a1a; }
        .day.empty { border: none; background: transparent; }
        .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .slot { padding: 12px; border: 1px solid #444444; border-radius: 8px; text-align: center; cursor: pointer; background: #222222; color: #ffffff; }
        .slot:hover:not(.disabled) { border-color: #ffffff; }
        .slot.selected { background: #ffffff; color: black; font-weight: bold; border-color: #ffffff; }
        .slot.disabled { background: #111111; color: #555555; border-color: #222222; cursor: not-allowed; }
        .submit { width: 100%; padding: 15px; margin-top: 25px; background: #ffffff; color: black; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .submit:hover { background: #cccccc; }
        #msg { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <header><h2>JAMES PHOTOGRAPHY</h2></header>
    <div class="container">
        <a href="index.html" class="home">← Back to Home</a>
        <input id="name" placeholder="Full Name" autocomplete="name" name="name">
        <input id="email" type="email" placeholder="Email Address" autocomplete="email" name="email">
        <input id="car" placeholder="Vehicle Details (Year, Make, Model)" autocomplete="off" name="car_details">
        
        <h3>Select Date</h3>
        <div class="cal-header">
            <button type="button" onclick="prevMonth()">◀</button>
            <div id="monthLabel">Loading Month...</div>
            <button type="button" onclick="nextMonth()">▶</button>
        </div>
        <div id="calendar"></div>
        
        <h3>Select Available Time Slot</h3>
        <div class="slot-grid" id="slots"></div>
        
        <button class="submit" onclick="book()">Request 2-Hour Session ($100)</button>
        <p id="msg"></p>
    </div>
    <script>
        const times = ["12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30"];
        let selectedDate = "";
        let selectedTime = "";
        let currentDate = new Date();
        let client = null;
        const EMAIL_WEBHOOK_URL = "";

        try {
            client = supabase.createClient("https://supabase.co", "sb_publishable_WAbUS1LIKOevak1NYGiaLA_OV5FiC1L");
        } catch(e) {
            console.error("Supabase failed initialization:", e.message);
        }
        
        function to12Hour(t){
            let [h, m] = t.split(":");
            h = parseInt(h);
            const ampm = h >= 12 ? "PM" : "AM";
            h = h % 12 || 12;
            return `${h}:${m} ${ampm}`;
        }
        
        async function getAppointments(){
            if (!client) return [];
            try {
                const { data, error } = await client.from("appointments").select("date,time");
                if (error) {
                    console.warn("Using local fallback array:", error.message);
                    return [];
                }
                return data || [];
            } catch (err) { 
                return []; 
            }
        }
        
        async function renderCalendar(){
            const calendar = document.getElementById("calendar");
            const label = document.getElementById("monthLabel");
            if(!calendar || !label) return;
            
            calendar.innerHTML = "";
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            label.innerText = currentDate.toLocaleString("default", { month: "long", year: "numeric" });
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // Safely await appointments or fetch fallback empty values if blocked
            const all = await getAppointments();
            
            for(let i = 0; i < firstDay; i++){
                const e = document.createElement("div"); e.className = "day empty"; calendar.appendChild(e);
            }
            for(let d = 1; d <= daysInMonth; d++){
                const targetDate = new Date(year, month, d);
                const dayOfWeek = targetDate.getDay(); 
                const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
                const div = document.createElement("div");
                div.className = "day"; div.innerText = d;
                const today = new Date(); today.setHours(0,0,0,0);
                if (targetDate < today || dayOfWeek === 0 || dayOfWeek === 4) {
                    div.classList.add("disabled");
                } else {
                    div.onclick = () => {
                        selectedDate = dateStr; selectedTime = "";
                        document.querySelectorAll(".day").forEach(x => x.classList.remove("selected"));
                        div.classList.add("selected"); renderSlots(all);
                    };
                }
                calendar.appendChild(div);
            }
        }

        function renderSlots(all){
            const container = document.getElementById("slots");
            if(!container) return;
            container.innerHTML = "";
            if(!selectedDate) return;
            const bookedTimes = all.filter(x => x.date === selectedDate).map(x => {
                const [h, m] = x.time.split(":"); return parseInt(h) * 60 + parseInt(m);
            });
            times.forEach(t => {
                const div = document.createElement("div"); div.className = "slot"; div.innerText = to12Hour(t);
                const [h, m] = t.split(":"); const currentSlotMinutes = parseInt(h) * 60 + parseInt(m);
                let isBlocked = false;
                bookedTimes.forEach(bookedMinutes => {
                    const timeDifference = Math.abs(currentSlotMinutes - bookedMinutes);
                    if (timeDifference < 120) { isBlocked = true; } // Rolling 2-hour blocking rule
                });
                if(isBlocked){ div.classList.add("disabled"); } else {
                    div.onclick = () => {
                        selectedTime = t; document.querySelectorAll(".slot").forEach(s => s.classList.remove("selected")); div.classList.add("selected");
                    };
                }
                container.appendChild(div);
            });
        }

        async function book(){
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const car = document.getElementById("car").value.trim();
            const msgElement = document.getElementById("msg");
            if(!name || !email || !car || !selectedDate || !selectedTime){
                if(msgElement) { msgElement.style.color = "#ff4444"; msgElement.innerText = "Please complete all fields."; }
                return;
            }
            if(!client) {
                if(msgElement) { msgElement.style.color = "#ff4444"; msgElement.innerText = "Database connection offline."; }
                return;
            }
            const { error } = await client.from("appointments").insert([{ name, email, car_details: car, date: selectedDate, time: selectedTime }]);
            if(error){
                if(msgElement) { msgElement.style.color = "#ff4444"; msgElement.innerText = error.message; }
                return;
            }
            if (EMAIL_WEBHOOK_URL) {
try {await fetch(EMAIL_WEBHOOK_URL, {method: "POST",headers: { "Content-Type": "application/json" },body: JSON.stringify({owner_email: "nmila001@doral.colegia.org",client_name: name, client_email: email, car_details: car, booking_date: selectedDate, booking_time: to12Hour(selectedTime)})});} catch (webhookError) {console.error("Webhook deferred:", webhookError.message);}}if(msgElement) { msgElement.style.color = "#44ff44"; msgElement.innerText = "Booking request submitted successfully!"; }selectedTime = "";document.getElementById("name").value = "";document.getElementById("email").value = "";document.getElementById("car").value = "";renderCalendar();}function nextMonth(){ currentDate.setMonth(currentDate.getMonth()+1); renderCalendar(); }function prevMonth(){ currentDate.setMonth(currentDate.getMonth()-1); renderCalendar(); }// Direct initial runtime render callrenderCalendar();
