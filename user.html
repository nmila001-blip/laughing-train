<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Appointment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial;
  background:#f4f7fb;
  margin:0;
}

header{
  background:#2563eb;
  color:white;
  text-align:center;
  padding:20px;
}

.container{
  max-width:500px;
  margin:30px auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

input,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}

.msg{
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h2>Book Appointment</h2>
</header>

<div class="container">

<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="date" type="date">
<input id="time" type="time">

<button onclick="book()">Submit</button>

<p id="msg" class="msg"></p>

</div>

<script>
const SUPABASE_URL = "https://fsbpbnurfbubflszjmas.supabase.co";
const SUPABASE_KEY = "sb_publishable_WAbUS1LIKOevak1NYGiaLA_OV5FiC1L";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// prevent past dates
document.getElementById("date").min =
  new Date().toISOString().split("T")[0];

async function book(){

  const msg = document.getElementById("msg");

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;

  // ✅ HARD VALIDATION (fixes your error)
  if (!name || !email || !date || !time) {
    msg.innerText = "❌ Please fill all fields.";
    return;
  }

  const { error } = await client
    .from("appointments")
    .insert([{
      name,
      email,
      date,
      time
    }]);

  if (error) {
    msg.innerText = "❌ " + error.message;
  } else {
    msg.innerText = "✅ Appointment booked!";
    
    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("date").value = "";
    document.getElementById("time").value = "";
  }
}
</script>

</body>
</html>
