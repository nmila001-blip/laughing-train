<!DOCTYPE html>
<html>
<head>
<title>Book Appointment</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f4f7fb;}
.container{max-width:500px;margin:40px auto;background:white;padding:20px;border-radius:12px;}
input,button{width:100%;padding:10px;margin:8px 0;}
button{background:#2563eb;color:white;border:none;border-radius:8px;}
.home{background:#e5e7eb;color:black;}
</style>
</head>

<body>

<div class="container">

<a href="index.html"><button class="home">🏠 Home</button></a>

<h2>Book Appointment</h2>

<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<input type="date" id="date">
<input type="time" id="time">

<button onclick="book()">Submit</button>

<p id="msg"></p>

</div>

<script>
const client = supabase.createClient(
"https://fsbpbnurfbubflszjmas.supabase.co",
"sb_publishable_WAbUS1LIKOevak1NYGiaLA_OV5FiC1L"
);

document.getElementById("date").min =
new Date().toISOString().split("T")[0];

async function book(){

const name = document.getElementById("name").value.trim();
const email = document.getElementById("email").value.trim();
const date = document.getElementById("date").value;
const time = document.getElementById("time").value;

if(!name || !email || !date || !time){
document.getElementById("msg").innerText="Fill all fields";
return;
}

const { error } = await client.from("appointments").insert([{
name,email,date,time
}]);

document.getElementById("msg").innerText =
error ? error.message : "Booked!";
}
</script>

</body>
</html>
