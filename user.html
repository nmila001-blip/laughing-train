<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Session - JAMES PHOTOGRAPHY</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#0b0b0b;
    color:white;
    padding:20px;
}

header{
    text-align:center;
    padding:25px;
}

header h1{
    letter-spacing:3px;
}

.container{
    max-width:700px;
    margin:20px auto;
    background:#161616;
    padding:25px;
    border-radius:12px;
    border:1px solid #2c2c2c;
    box-shadow:0 4px 20px rgba(0,0,0,.5);
}

.home{
    color:#aaa;
    text-decoration:none;
    display:inline-block;
    margin-bottom:20px;
}

.home:hover{
    color:white;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    background:#222;
    border:1px solid #444;
    border-radius:8px;
    color:white;
}

input:focus{
    outline:none;
    border-color:white;
}

h3{
    margin:20px 0 10px;
    color:#aaa;
    text-transform:uppercase;
    font-size:14px;
}

.cal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.cal-header button{
    background:white;
    color:black;
    border:none;
    padding:8px 15px;
    border-radius:6px;
    cursor:pointer;
}

#calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
}

.day{
    background:#222;
    padding:12px;
    text-align:center;
    border-radius:8px;
    border:1px solid #333;
    cursor:pointer;
}

.day:hover:not(.disabled):not(.empty){
    border-color:white;
}

.day.selected{
    background:white;
    color:black;
}

.day.disabled{
    background:#111;
    color:#555;
    cursor:not-allowed;
}

.day.empty{
    background:none;
    border:none;
}

.slot-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.slot{
    background:#222;
    border:1px solid #444;
    padding:12px;
    border-radius:8px;
    text-align:center;
    cursor:pointer;
}

.slot.selected{
    background:white;
    color:black;
}

.slot.disabled{
    background:#111;
    color:#555;
    cursor:not-allowed;
}

.submit{
    width:100%;
    margin-top:25px;
    padding:15px;
    background:white;
    color:black;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.submit:hover{
    background:#ddd;
}

#msg{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

@media(max-width:600px){
    .slot-grid{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>

</head>

<body>

<header>
<h1>JAMES PHOTOGRAPHY</h1>
</header>

<div class="container">

<a href="index.html" class="home">
← Back to Home
</a>

<input id="name" placeholder="Full Name">

<input id="email" type="email" placeholder="Email Address">

<input id="car" placeholder="Vehicle Details (Year, Make, Model)">


<h3>Select Date</h3>

<div class="cal-header">

<button onclick="prevMonth()">◀</button>

<div id="monthLabel"></div>

<button onclick="nextMonth()">▶</button>

</div>


<div id="calendar"></div>


<h3>Select Time</h3>

<div id="slots" class="slot-grid"></div>


<button class="submit" onclick="book()">
Request 2-Hour Session ($100)
</button>


<p id="msg"></p>

</div>


<script>

const SUPABASE_URL =
"https://fsbpbnurfbubflszjmas.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WAbUS1LIKOevak1NYGiaLA_OV5FiC1L";


const client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const TIMES=[
"12:00","12:30",
"13:00","13:30",
"14:00","14:30",
"15:00","15:30",
"16:00","16:30",
"17:00","17:30"
];


let selectedDate="";
let selectedTime="";
let currentDate=new Date();


function formatTime(time){

let [h,m]=time.split(":");

h=parseInt(h);

let suffix=h>=12?"PM":"AM";

h=h%12||12;

return `${h}:${m} ${suffix}`;

}


async function getAppointments(){

const {data,error}=await client
.from("appointments")
.select("date,time");


if(error){

console.error(error);

return [];

}


return data || [];

}
    async function renderCalendar(){

const calendar=document.getElementById("calendar");
const label=document.getElementById("monthLabel");

calendar.innerHTML="";


const year=currentDate.getFullYear();
const month=currentDate.getMonth();


label.textContent=currentDate.toLocaleString("default",{
    month:"long",
    year:"numeric"
});


const firstDay=new Date(year,month,1).getDay();

const daysInMonth=new Date(year,month+1,0).getDate();


const appointments=await getAppointments();



for(let i=0;i<firstDay;i++){

const empty=document.createElement("div");

empty.className="day empty";

calendar.appendChild(empty);

}



for(let d=1;d<=daysInMonth;d++){


const date=new Date(year,month,d);

const dateString=
`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;



const cell=document.createElement("div");

cell.className="day";

cell.textContent=d;



const today=new Date();

today.setHours(0,0,0,0);



if(date < today){


cell.classList.add("disabled");


}else{


cell.onclick=()=>{


document.querySelectorAll(".day")
.forEach(x=>x.classList.remove("selected"));


cell.classList.add("selected");


selectedDate=dateString;

selectedTime="";


renderSlots(appointments);


};


}



calendar.appendChild(cell);



}



}




function renderSlots(appointments){


const container=document.getElementById("slots");

container.innerHTML="";


if(!selectedDate)return;



// Convert existing bookings into minutes

const bookedMinutes=appointments

.filter(a=>a.date===selectedDate)

.map(a=>{

let [h,m]=a.time.split(":");

return parseInt(h)*60+parseInt(m);

});




TIMES.forEach(time=>{


const slot=document.createElement("div");

slot.className="slot";

slot.textContent=formatTime(time);



let [h,m]=time.split(":");

let currentMinutes=parseInt(h)*60+parseInt(m);



let blocked=false;



bookedMinutes.forEach(booked=>{


let difference=currentMinutes-booked;



// 2 hour session + 30 minute travel/setup buffer

if(difference>=0 && difference<150){

blocked=true;

}


});




if(blocked){


slot.classList.add("disabled");



}else{


slot.onclick=()=>{


document.querySelectorAll(".slot")
.forEach(x=>x.classList.remove("selected"));


slot.classList.add("selected");


selectedTime=time;


};



}



container.appendChild(slot);



});



}





async function book(){


const name=document.getElementById("name").value.trim();

const email=document.getElementById("email").value.trim();

const car=document.getElementById("car").value.trim();

const msg=document.getElementById("msg");



const emailCheck=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;



if(!name || !email || !car || !selectedDate || !selectedTime){


msg.style.color="#ff4444";

msg.textContent="Please complete all fields.";

return;


}




if(!emailCheck.test(email)){


msg.style.color="#ff4444";

msg.textContent="Please enter a valid email.";

return;


}




const {error}=await client

.from("appointments")

.insert([{

name:name,

email:email,

car_details:car,

date:selectedDate,

time:selectedTime

}]);




if(error){


msg.style.color="#ff4444";

msg.textContent=error.message;

return;


}




msg.style.color="#44ff44";

msg.textContent="Booking request submitted successfully!";



document.getElementById("name").value="";

document.getElementById("email").value="";

document.getElementById("car").value="";


selectedDate="";

selectedTime="";


await renderCalendar();


document.getElementById("slots").innerHTML="";



}




function nextMonth(){

currentDate.setMonth(currentDate.getMonth()+1);

renderCalendar();

}




function prevMonth(){


const now=new Date();



if(

currentDate.getMonth()===now.getMonth() &&

currentDate.getFullYear()===now.getFullYear()

){

return;

}



currentDate.setMonth(currentDate.getMonth()-1);


renderCalendar();


}




renderCalendar();


</script>


</body>

</html>
