<style>
*{
    box-sizing:border-box;

body{

<body>

<header>
    <h1>JAMES PHOTOGRAPHY</h1>
</header>

<div class="container">

    <a href="index.html" class="home">← Back to Home</a>

    <input id="name" type="text" placeholder="Full Name">
    <input id="email" type="email" placeholder="Email Address">
    <input id="car" type="text" placeholder="Vehicle Details (Year, Make, Model)">

    <h3>Select Date</h3>

    <div class="cal-header">
        <button onclick="prevMonth()">◀</button>
        <div id="monthLabel"></div>
        <button onclick="nextMonth()">▶</button>
    </div>

    <div id="calendar"></div>

    <h3>Select Time</h3>
    <div class="slot-grid" id="slots"></div>

    <button class="submit" onclick="book()">
        Request 2-Hour Session ($100)
    </button>

    <div id="msg"></div>

</div>

<script>
const SUPABASE_URL = "https://fsbpbnurfbubflszjmas.supabase.co";
const SUPABASE_KEY = "sb_publishable_WAbUS1LIKOevak1NYGiaLA_OV5FiC1L";

const client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const TIMES = [
    "12:00","12:30","13:00","13:30",
    "14:00","14:30","15:00","15:30",
    "16:00","16:30","17:00","17:30"
];

let selectedDate = "";
let selectedTime = "";
let currentDate = new Date();

function formatTime(time){
    let [h,m] = time.split(":");
    h = parseInt(h);

    const suffix = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;

    return `${h}:${m} ${suffix}`;
}

async function getAppointments(){
    const { data, error } = await client
        .from("appointments")
        .select("date,time");

    if(error){
        console.error(error);
        return [];
    }

    return data || [];
}

async function renderCalendar(){

    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthLabel").textContent =
        currentDate.toLocaleString("default", {
            month:"long",
            year:"numeric"
        });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const appointments = await getAppointments();

    for(let i=0;i<firstDay;i++){
        const empty = document.createElement("div");
        empty.className = "day empty";
        calendar.appendChild(empty);
    }

    for(let day=1;day<=daysInMonth;day++){

        const date = new Date(year, month, day);
        const dateString =
            `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

        const cell = document.createElement("div");
        cell.className = "day";
        cell.textContent = day;

        const today = new Date();
        today.setHours(0,0,0,0);

        if(date < today){
            cell.classList.add("disabled");
        }else{
            cell.onclick = () => {

                document.querySelectorAll(".day")
                    .forEach(d => d.classList.remove("selected"));

                cell.classList.add("selected");

                selectedDate = dateString;
                selectedTime = "";

                renderSlots(appointments);
            };
        }

        calendar.appendChild(cell);
    }
}

function renderSlots(appointments){

    const container = document.getElementById("slots");
    container.innerHTML = "";

    if(!selectedDate) return;

    const booked = appointments
        .filter(a => a.date === selectedDate)
        .map(a => a.time);

    TIMES.forEach(time => {

        const slot = document.createElement("div");
        slot.className = "slot";
        slot.textContent = formatTime(time);

        if(booked.includes(time)){
            slot.classList.add("disabled");
        }else{
            slot.onclick = () => {

                document.querySelectorAll(".slot")
                    .forEach(s => s.classList.remove("selected"));

                slot.classList.add("selected");
                selectedTime = time;
            };
        }

        container.appendChild(slot);
    });
}

async function book(){

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const car = document.getElementById("car").value.trim();
    const msg = document.getElementById("msg");

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!name || !email || !car || !selectedDate || !selectedTime){
        msg.style.color = "#ff4444";
        msg.textContent = "Please complete all fields.";
        return;
    }

    if(!emailRegex.test(email)){
        msg.style.color = "#ff4444";
        msg.textContent = "Enter a valid email address.";
        return;
    }

    const { error } = await client
        .from("appointments")
        .insert([
            {
                name,
                email,
                car_details: car,
                date: selectedDate,
                time: selectedTime
            }
        ]);

    if(error){
        msg.style.color = "#ff4444";
        msg.textContent = error.message;
        return;
    }

    msg.style.color = "#44ff44";
    msg.textContent = "Booking request submitted successfully.";

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("car").value = "";

    selectedDate = "";
    selectedTime = "";

    await renderCalendar();
    document.getElementById("slots").innerHTML = "";
}

function nextMonth(){
    currentDate.setMonth(currentDate.getMonth()+1);
    renderCalendar();
}

function prevMonth(){

    const today = new Date();

    if(
        currentDate.getMonth() === today.getMonth() &&
        currentDate.getFullYear() === today.getFullYear()
    ){
        return;
    }

    currentDate.setMonth(currentDate.getMonth()-1);
    renderCalendar();
}

renderCalendar();
</script>

</body>
</html>
