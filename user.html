<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Patient Booking</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#333;
}

header{
  background:#2563eb;
  color:white;
  padding:25px;
  text-align:center;
}

.container{
  max-width:600px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

h2{
  color:#2563eb;
  margin-bottom:20px;
}

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
}

.btn{
  width:100%;
  border:none;
  padding:14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  margin-top:10px;
}

.primary{
  background:#2563eb;
  color:white;
}

.primary:hover{
  background:#1e40af;
}

.back-btn{
  background:white;
  color:#2563eb;
  border:1px solid #2563eb;
  text-decoration:none;
  display:block;
  text-align:center;
}

.success-msg{
  display:none;
  background:#dcfce7;
  color:#166534;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  text-align:center;
}
</style>
</head>

<body>

<header>
  <h1>Imaginary Clinic</h1>
  <p>Patient Booking Portal</p>
</header>

<div class="container">
  <div class="card">

    <h2>Schedule Appointment</h2>

    <div id="successMsg" class="success-msg">
      Appointment booked successfully!
    </div>

    <form id="bookingForm">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required />
      </div>

      <div class="form-group">
        <label>Date</label>
        <input type="date" id="date" required />
      </div>

      <div class="form-group">
        <label>Time</label>
        <input type="time" id="time" required />
      </div>

      <button type="submit" class="btn primary">
        Submit Appointment
      </button>

      <a href="index.html" class="btn back-btn">
        Back to Home
      </a>

    </form>
  </div>
</div>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

document.getElementById("date").min =
  new Date().toISOString().split("T")[0];

const form = document.getElementById("bookingForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const submitBtn = document.querySelector("button[type='submit']");
  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";

  const appointment = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    date: document.getElementById("date").value,
    time: document.getElementById("time").value
  };

  try{
    const { error } = await client
      .from("appointments")
      .insert([appointment]);

    if(error){
      alert(error.message);
    }else{
      form.reset();

      const msg = document.getElementById("successMsg");
      msg.style.display = "block";

      setTimeout(() => {
        msg.style.display = "none";
      }, 4000);
    }
  }catch(err){
    alert(err.message);
  }

  submitBtn.disabled = false;
  submitBtn.textContent = "Submit Appointment";
});
</script>

</body>
</html>
